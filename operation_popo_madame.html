<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opération Popo — Ta Madame</title>
<style>
:root{--pink:#ff8cbb;--gold:#ffe08a;--ink:#fff7fc;--bg:#221329;--panel:#39203f;--panel2:#4c2b51;--green:#b8ffd5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#60365f,#211126 65%);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
header{text-align:center;padding:24px 16px 8px}h1{font-size:clamp(2.4rem,9vw,4rem);line-height:1.03;margin:8px 0;color:var(--gold);font-family:Georgia,serif;text-shadow:0 4px 0 #6c345b}
.kicker{text-transform:uppercase;letter-spacing:.15em;color:#ffc0dc;font-size:.8rem;font-weight:800}.hero{font-size:5rem;line-height:1.3;filter:drop-shadow(0 6px 10px #0006)}
main{max-width:720px;padding:12px 15px 40px;margin:auto}.card{background:linear-gradient(150deg,#492b51,#2f1c3a);border:1px solid #a55d8c;border-radius:22px;padding:22px;margin:12px 0;box-shadow:0 16px 35px #12081580}
h2{color:var(--gold);font-family:Georgia,serif;font-size:1.8rem;margin:.2rem 0 .8rem}p{margin:.6rem 0}.quote{background:#170f2480;border-left:4px solid var(--pink);padding:14px;border-radius:0 12px 12px 0}
button{font:inherit;cursor:pointer;border-radius:13px;border:1px solid #c979a7;padding:12px 16px;color:white;background:#62365e}button:hover{filter:brightness(1.15)}.primary{background:var(--pink);color:#32142d;font-weight:900;border-color:var(--pink)}.choices button{display:block;width:100%;text-align:left;margin:9px 0}.feedback{min-height:28px;margin-top:12px;color:var(--gold);font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}.small{font-size:.9rem;color:#e2cfe2}.hidden{display:none}.meter{height:8px;background:#6c496d;border-radius:99px;overflow:hidden;margin:18px auto;max-width:500px}.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .3s}.sticker{font-size:2rem;display:inline-block;background:#2a1833;border-radius:18px;padding:8px 13px;margin:4px}footer{text-align:center;color:#e7c9e3;padding:16px}.signature{font-family:Georgia,serif;font-size:1.3rem;color:var(--pink);font-weight:bold;text-align:right}.success{color:var(--green)}input{font:inherit;padding:12px;border-radius:12px;border:1px solid #b47aa4;background:#25152e;color:white;width:100%;margin-top:10px}
</style>
</head>
<body>
<header><div class="kicker">Message hautement scientifique de Mdame</div><div class="hero">🚨💩🚽</div><h1>OPÉRATION<br>POPO</h1><p>Une enquête qui ne manque pas de fond… ni de fondement.</p><div class="meter"><div id="bar"></div></div><div id="count" class="small">Mission spéciale · 3 épreuves</div></header>
<main><section class="card" id="game"></section><footer>Que la force du transit soit avec toi ! 🙏🤣<div class="signature">Ta Madame ❤️💩</div></footer></main>
<script>
const game=document.getElementById('game'),bar=document.getElementById('bar'),count=document.getElementById('count');
let stage=0,score=0;
function render(){
bar.style.width=(stage/3*100)+'%';count.textContent=stage===0?'Mission spéciale · 3 épreuves':stage<=3?`Épreuve ${stage} sur 3`:'Mission accomplie';
if(stage===0){game.innerHTML=`<div class="hero">🕵️‍♂️💩</div><h2>Communiqué officiel de Ta Madame</h2><div class="quote">J’ai décidé de parler aujourd’hui d’un sujet d’une importance capitale : <strong>LE POPO</strong>. 🤣<br><br>Parce qu’il y a des choses dans la vie qu’on ne peut pas ignorer… et d’autres qu’on ne peut littéralement pas retenir ! 💩😂</div><p>Quentin, une urgence nationale vient d’être signalée aux toilettes. Un popo a disparu sans remplir le formulaire de sortie. Ta mission : résoudre cette affaire avant que le papier toilette ne prenne sa retraite.</p><p><span class="sticker">🧻</span><span class="sticker">🔎</span><span class="sticker">🚽</span></p><button class="primary" onclick="go(1)">Lancer l’enquête 💥</button>`;return}
if(stage===1){game.innerHTML=`<div class="hero">🔎💩</div><h2>Épreuve 1 — Le suspect mystère</h2><p>Le témoin affirme avoir vu quelque chose de brun, pressé, et qui n’a pas dit bonjour. Qui est le principal suspect ?</p><div class="choices"><button onclick="answer(1,'a')">A. Un rouleau de papier toilette en cavale</button><button onclick="answer(1,'b')">B. Un popo fugitif recherché par la brigade des toilettes</button><button onclick="answer(1,'c')">C. Le fantôme d’une biscotte</button></div><div class="feedback" id="f"></div>`;return}
if(stage===2){game.innerHTML=`<div class="hero">🧮🚽</div><h2>Épreuve 2 — Le calcul intestinal</h2><p>Sept popos se trouvent dans le couloir. Trois prennent la fuite en criant « On ne nous passera pas à la chasse ! »</p><p><strong>Combien en reste-t-il ?</strong></p><div class="choices"><button onclick="answer(2,'a')">A. 10 — ils ont appelé des renforts</button><button onclick="answer(2,'b')">B. 4 — les mathématiques sont impitoyables</button><button onclick="answer(2,'c')">C. 72 — calcul validé par un canard</button></div><div class="feedback" id="f"></div>`;return}
if(stage===3){game.innerHTML=`<div class="hero">🚽🦸</div><h2>Épreuve 3 — Le destin du popo</h2><p>Le popo se trouve devant la cuvette. La musique dramatique commence. Le papier toilette retient son souffle.</p><p><strong>Que doit-il faire ?</strong></p><div class="choices"><button onclick="answer(3,'a')">A. Faire demi-tour et devenir influenceur</button><button onclick="answer(3,'b')">B. Demander un autographe au rouleau</button><button onclick="answer(3,'c')">C. Accomplir sa destinée et tirer la chasse</button></div><div class="feedback" id="f"></div>`;return}
if(stage===4){game.innerHTML=`<div class="hero">🏆💩🎉</div><h2>Mission accomplie !</h2><p>Après une enquête éprouvante, des calculs de haut niveau et une quantité inquiétante de papier toilette, tu as résolu l’affaire.</p><div class="quote"><strong>Verdict officiel :</strong><br>Tu es désormais <strong>commissaire divisionnaire du popo</strong>, responsable des affaires urgentes et des disparitions suspectes dans les sanitaires.</div><p>J’espère que tu feras ton petit popo en pensant très fort à moi. Je veux être présente dans tes pensées… même dans les moments les plus merdiques ! 🤣</p><p>Et si jamais il est particulièrement réussi, sache que je serai très fière de toi. Une petite pensée pour Madame pendant l’effort, une petite larme de joie à la fin… et voilà une journée qui commence bien ! 🏆💩</p><div class="quote"><strong>Que la force du transit soit avec toi !</strong> 🙏🤣<br><br>Je t’embrasse… mais je te laisse gérer la suite aux toilettes. Je ne voudrais pas m’imposer dans ce moment d’intimité. 😂</div><div class="signature">Ta Madame ❤️💩</div><p class="small">Score : ${score}/3 bonnes réponses. (Aucun popo n’a été maltraité pendant cette enquête.)</p><button class="primary" onclick="location.reload()">Rejouer l’enquête ↻</button>`;bar.style.width='100%';return}
}
function go(n){stage=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function answer(n,a){let correct=(n===1&&a==='b')||(n===2&&a==='b')||(n===3&&a==='c');let f=document.getElementById('f');if(correct){score++;f.textContent=['','Exact ! Le popo est activement recherché. La brigade des toilettes te remercie. 💩','Bonne réponse ! 7 − 3 = 4. Le ministère des mathématiques intestinales valide ce calcul.','Exact ! Le popo a accompli sa destinée. Le rouleau de papier toilette est ému.'][n];f.className='feedback success';setTimeout(()=>go(n+1),1300)}else{f.textContent='Mauvaise piste ! Même la chasse d’eau fait « oh là là ». Essaie encore ! 😂';f.className='feedback';}}
render();
</script></body></html>
